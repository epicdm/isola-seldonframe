# Isola build of SeldonFrame (see ISOLA-BUILD.md). Manual run only. Verifies, then builds one amd64 image.
# Action versions and Node/pnpm versions match upstream's own CI (.github/workflows/ci.yml, kept unchanged in this fork).
name: build-isola-seldonframe
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: Public base URL baked into the client bundle
        default: https://front.isola.epic.dm
permissions:
  contents: read
  packages: write
concurrency:
  group: build-isola-seldonframe
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration journal check (upstream gate)
        run: pnpm db:check-journaled
      - name: Typecheck (crm)
        env:
          NODE_OPTIONS: --max-old-space-size=6000
        run: pnpm --filter @seldonframe/crm exec tsc --noEmit
      - name: Launch specs
        working-directory: packages/crm
        run: node --import tsx --test tests/unit/agents/form-follow-up.spec.ts tests/unit/agents/portal-service-links.spec.ts tests/unit/agents/portal-email.spec.ts tests/unit/agents/follow-up-responder.spec.ts tests/unit/agents/contact-from-answers.spec.ts
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_APP_URL=${{ inputs.public_url }}
          tags: ghcr.io/${{ github.repository_owner }}/isola-seldonframe:signin-2026-10-06
      - run: echo "image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"