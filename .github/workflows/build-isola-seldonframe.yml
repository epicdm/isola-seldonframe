# Uplink native bring-up build (Lane A): the exact working revision fd070e572f5653816cf77eebd1c6bdeb8a79128a with ONLY the public origin default and the image tag changed (no source change).
# Isola build of SeldonFrame (see ISOLA-BUILD.md). Manual run only. Verifies, then builds one amd64 image.
# Action versions and Node/pnpm versions match upstream's own CI (.github/workflows/ci.yml, kept unchanged in this fork).
name: build-isola-seldonframe
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: Public base URL baked into the client bundle
        default: https://uplink.epic.dm
      platform_name:
        description: Customer-visible platform name
        default: Uplink
      platform_operator_name:
        description: Operating company name
        default: EPIC
      platform_app_url:
        description: Canonical platform origin
        default: https://uplink.epic.dm
      platform_home_url:
        description: Public platform home URL
        default: https://uplink.epic.dm
      platform_support_email:
        description: Public support contact
        default: uplink@epic.dm
      platform_email_from_name:
        description: Sign-in email sender display name
        default: Uplink by EPIC
      platform_email_footer:
        description: Sign-in email footer
        default: Uplink is operated by EPIC - uplink@epic.dm
      workspace_base_domain:
        description: Base domain for customer workspace URLs
        default: uplink.epic.dm
      app_hosts:
        description: Additional canonical app host allow-list
        default: uplink.epic.dm
      platform_logo_url:
        description: Optional HTTPS or root-relative Uplink logo
        default: ""
      platform_favicon_url:
        description: Optional HTTPS or root-relative Uplink favicon
        default: ""
      platform_source_url:
        description: Public URL for this exact corresponding source (leave blank until authorized and published)
        default: ""
      show_vendor_branding:
        description: Global visibility preference; commercial entitlement remains authoritative
        default: "false"
permissions:
  contents: read
  packages: write
concurrency:
  group: build-isola-seldonframe-uplink-native
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate canonical platform origins
        shell: bash
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
          PLATFORM_APP_URL: ${{ inputs.platform_app_url }}
          PLATFORM_HOME_URL: ${{ inputs.platform_home_url }}
          WORKSPACE_BASE_DOMAIN: ${{ inputs.workspace_base_domain }}
          APP_HOSTS: ${{ inputs.app_hosts }}
        run: |
          test "$PUBLIC_URL" = "$PLATFORM_APP_URL"
          test "$PLATFORM_APP_URL" = "$PLATFORM_HOME_URL"
          case "$PUBLIC_URL" in https://*) ;; *) echo "Uplink origins must use HTTPS"; exit 1 ;; esac
          public_host="${PUBLIC_URL#https://}"
          public_host="${public_host%%/*}"
          test "$public_host" = "$WORKSPACE_BASE_DOMAIN"
          test "$public_host" = "$APP_HOSTS"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration journal check (upstream gate)
        run: pnpm db:check-journaled
      - name: Typecheck (crm)
        env:
          NODE_OPTIONS: --max-old-space-size=6000
        run: pnpm --filter @seldonframe/crm exec tsc --noEmit
      - name: Launch specs
        working-directory: packages/crm
        run: node --import tsx --test tests/unit/agents/form-follow-up.spec.ts tests/unit/agents/portal-service-links.spec.ts tests/unit/agents/portal-email.spec.ts tests/unit/agents/follow-up-responder.spec.ts tests/unit/agents/contact-from-answers.spec.ts
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: uplink
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ inputs.public_url }}
            PLATFORM_NAME=${{ inputs.platform_name }}
            PLATFORM_OPERATOR_NAME=${{ inputs.platform_operator_name }}
            PLATFORM_APP_URL=${{ inputs.platform_app_url }}
            PLATFORM_HOME_URL=${{ inputs.platform_home_url }}
            PLATFORM_SUPPORT_EMAIL=${{ inputs.platform_support_email }}
            PLATFORM_EMAIL_FROM_NAME=${{ inputs.platform_email_from_name }}
            PLATFORM_EMAIL_FOOTER=${{ inputs.platform_email_footer }}
            WORKSPACE_BASE_DOMAIN=${{ inputs.workspace_base_domain }}
            APP_HOSTS=${{ inputs.app_hosts }}
            PLATFORM_LOGO_URL=${{ inputs.platform_logo_url }}
            PLATFORM_FAVICON_URL=${{ inputs.platform_favicon_url }}
            PLATFORM_SOURCE_URL=${{ inputs.platform_source_url }}
            SHOW_VENDOR_BRANDING=${{ inputs.show_vendor_branding }}
          tags: ghcr.io/${{ github.repository_owner }}/isola-seldonframe:uplink-native-${{ github.sha }}
      - run: echo "image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
