# Manual candidate build only. EasyPanel is the sole deployment/control plane.
name: build-isola-seldonframe
on:
  workflow_dispatch:
    inputs:
      staging_public_url:
        description: Canonical staging origin baked into the staging client bundle
        default: https://build.uplink.epic.dm
      production_public_url:
        description: Canonical production origin baked into the production client bundle
        default: https://uplink.epic.dm
permissions:
  contents: read
  packages: write
concurrency:
  group: build-isola-seldonframe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seldon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seldon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration journal check
        run: pnpm db:check-journaled
      - name: Browser PostgreSQL boundary guard controls
        run: node --test packages/crm/scripts/assert-browser-pg-boundary.test.mjs
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6000
        run: pnpm --filter @seldonframe/crm exec tsc --noEmit
      - name: Prepare disposable PostgreSQL schema
        run: pnpm --filter @seldonframe/crm db:push --force
        env:
          DB_DRIVER: pg
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seldon_test
      - name: Validate origin inputs
        env:
          STAGING_PUBLIC_URL: ${{ inputs.staging_public_url }}
          PRODUCTION_PUBLIC_URL: ${{ inputs.production_public_url }}
        run: |
          test "$STAGING_PUBLIC_URL" = "https://build.uplink.epic.dm"
          test "$PRODUCTION_PUBLIC_URL" = "https://uplink.epic.dm"
      - name: Full unit and PostgreSQL transaction suite
        run: pnpm test:unit
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seldon_test
      - name: Repeat synthetic Uplink fixture seed
        run: |
          pnpm --filter @seldonframe/crm db:seed-uplink
          pnpm --filter @seldonframe/crm db:seed-uplink
        env:
          NODE_ENV: test
          UPLINK_FIXTURES: enabled
          PLATFORM_APP_URL: http://localhost:3000
          DB_DRIVER: pg
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seldon_test
      - name: Schema drift check
        run: pnpm --filter @seldonframe/crm db:assert-drift
        env:
          DB_DRIVER: pg
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seldon_test
      - name: BLOCK.md emit drift detector
        run: pnpm emit:blocks:check
      - name: Event registry drift detector
        run: pnpm emit:event-registry:check
      - name: Generator regression suite
        run: cd packages/crm && node --import tsx --test tests/regression/generator-prompts.spec.ts
  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            public_url: ${{ inputs.staging_public_url }}
          - target: production
            public_url: ${{ inputs.production_public_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ matrix.public_url }}
            UPLINK_DIAG_BROWSER_SOURCEMAPS=1
          tags: ghcr.io/${{ github.repository_owner }}/isola-seldonframe:uplink-${{ matrix.target }}-${{ github.sha }}
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/isola-seldonframe:uplink-${{ matrix.target }}-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          PUBLIC_URL: ${{ matrix.public_url }}
        run: |
          printf 'target=%s\nsource=%s\norigin=%s\nimage=%s@%s\n' "${{ matrix.target }}" "$SOURCE_SHA" "$PUBLIC_URL" "$IMAGE_TAG" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
