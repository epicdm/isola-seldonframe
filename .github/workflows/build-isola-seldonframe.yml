# Manual candidate build only. EasyPanel is the sole deployment/control plane.
name: build-isola-seldonframe
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: Canonical public URL baked into the client bundle
        default: https://uplink.epic.dm
permissions:
  contents: read
  packages: write
concurrency:
  group: build-isola-seldonframe
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seldon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seldon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration journal check
        run: pnpm db:check-journaled
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6000
        run: pnpm --filter @seldonframe/crm exec tsc --noEmit
      - name: Prepare disposable PostgreSQL schema
        run: pnpm --filter @seldonframe/crm db:push --force
        env:
          DB_DRIVER: pg
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seldon_test
      - name: Full unit and PostgreSQL transaction suite
        run: pnpm test:unit
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seldon_test
      - name: Repeat synthetic Uplink fixture seed
        run: |
          pnpm --filter @seldonframe/crm db:seed-uplink
          pnpm --filter @seldonframe/crm db:seed-uplink
        env:
          NODE_ENV: test
          UPLINK_FIXTURES: enabled
          PLATFORM_APP_URL: http://localhost:3000
          DB_DRIVER: pg
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seldon_test
      - name: Schema drift check
        run: pnpm --filter @seldonframe/crm db:assert-drift
        env:
          DB_DRIVER: pg
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seldon_test
      - name: BLOCK.md emit drift detector
        run: pnpm emit:blocks:check
      - name: Event registry drift detector
        run: pnpm emit:event-registry:check
      - name: Generator regression suite
        run: cd packages/crm && node --import tsx --test tests/regression/generator-prompts.spec.ts
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_APP_URL=${{ inputs.public_url }}
          tags: ghcr.io/${{ github.repository_owner }}/isola-seldonframe:uplink-phase1-${{ github.sha }}
      - name: Record immutable image reference
        run: echo "image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
